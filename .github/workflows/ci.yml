name: Frontend CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check, and build
        run: npm run check
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
          NEXT_PUBLIC_ASSET_BASE_URL: https://api.example.invalid
          NEXT_PUBLIC_SITE_URL: https://www.example.invalid
